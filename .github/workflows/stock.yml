name: Update stock
# Every hour: ask Ralawise how many of each size/colour are in stock, save stock.json for the site.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: stock
jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update-stock.py
      - name: Save stock.json
        run: |
          git config user.name "pointe-and-print stock"
          git config user.email "actions@users.noreply.github.com"
          git add stock.json
          git diff --cached --quiet || (git commit -m "Update stock" && git push)
